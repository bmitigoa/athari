      from:
        - published
      to: published
      weight: 4
    restore:
      label: 'Restore archived report to draft'
      from:
        - archived
      to: draft
      weight: 6
    return_to_draft:
      label: 'Reject (return to draft)'
      from:
        - in_review
      to: draft
      weight: 2

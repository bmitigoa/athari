id: report_review
label: 'Report review'
type: content_moderation
type_settings:
  states:
    archived:
      label: Archived
      weight: 3
      published: false
      default_revision: true
    draft:
      label: Draft
      weight: 0
      published: false
      default_revision: false
    in_review:
      label: 'In Review'
      weight: 1
      published: false
      default_revision: false
    published:
      label: Published
      weight: 2
      published: true
      default_revision: true
  transitions:
    archive:
      label: Archive
      from:
        - published
      to: archived
      weight: 5
    create_draft:
      label: 'Save as draft'
      from:
        - draft
      to: draft
      weight: 0
    publish:
      label: 'Approve and publish'
      from:
        - in_review
      to: published
      weight: 3
    republish:
